name: Keep Render awake + uptime alert

# Render's free tier spins the service down after ~15 min of inactivity, causing
# slow cold-starts / transient 502s. This free GitHub Action pings the health
# endpoint every 5 minutes to keep the instance warm, AND doubles as an uptime
# monitor: it alerts when the site is unhealthy (HTTP != 200 **or** the body
# reports "db":"down") and closes the issue automatically on recovery.
#
# WARM WINDOW: only 08:00-22:00 Tunisia time (UTC+1) = cron 07:00-20:59 UTC.
# Outside the window the free instance sleeps (~9h/night), saving ~300 of the
# 750 shared free instance hours per month so a second free service can run
# alongside without suspending the workspace. Use workflow_dispatch to warm the
# site manually for a night demo. First ping 08:00 TU, last ping 21:55 TU,
# instance sleeps ~22:10 TU.
#
# The backend caches the DB probe (~1 hour when "up", 15 s when "down"), so these
# pings do NOT wake Neon every 5 minutes anymore. Waking Neon 24/7 used up the
# free plan's 100 CU-hour monthly compute quota around 27-09-2026 and Neon then
# suspended the database (site logins started failing).

on:
  schedule:
    - cron: '*/5 7-20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping health endpoint (wakes Render; DB probe is cached upstream)
        id: check
        run: |
          code=""; db=""; ok="false"
          for i in 1 2 3; do
            out=$(curl -s -w '\n%{http_code}' --max-time 30 https://rafiqi-platform.onrender.com/api/health || true)
            code=$(printf '%s' "$out" | tail -n1)
            body=$(printf '%s' "$out" | sed '$d')
            [ -z "$code" ] && code="000"
            db=$(printf '%s' "$body" | sed -n 's/.*"db":"\([a-z]*\)".*/\1/p')
            echo "attempt $i -> HTTP $code db=${db:-unknown}"
            if [ "$code" = "200" ] && { [ "$db" = "up" ] || [ -z "$db" ]; }; then
              ok="true"; break
            fi
            sleep 20
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "db=${db:-unknown}" >> "$GITHUB_OUTPUT"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      # False-alarm guard: Render's free tier answers 429 (rate limit) while the
      # instance is spinning up or going down, and 502/503 while it boots. Both
      # clear on their own within a couple of minutes (observed 04-10 and 14-10).
      # So a failed fast check is NOT alerted on directly - it must fail a second,
      # slower confirmation round first. Real outages fail both rounds.
      - name: Confirm before alerting (avoids 429/boot false alarms)
        id: confirm
        if: steps.check.outputs.ok != 'true'
        run: |
          code=""; db=""; ok="false"
          for i in 1 2 3 4; do
            out=$(curl -s -w '\n%{http_code}' --max-time 45 https://rafiqi-platform.onrender.com/api/health || true)
            code=$(printf '%s' "$out" | tail -n1)
            body=$(printf '%s' "$out" | sed '$d')
            [ -z "$code" ] && code="000"
            db=$(printf '%s' "$body" | sed -n 's/.*"db":"\([a-z]*\)".*/\1/p')
            echo "confirm $i -> HTTP $code db=${db:-unknown}"
            if [ "$code" = "200" ] && { [ "$db" = "up" ] || [ -z "$db" ]; }; then
              ok="true"; break
            fi
            sleep 45
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "db=${db:-unknown}" >> "$GITHUB_OUTPUT"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Open alert issue if unhealthy
        if: steps.confirm.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create "site-down" --color "d73a4a" --description "Site health check failed" 2>/dev/null || true
          open=$(gh issue list --state open --label "site-down" --json number -q 'length' 2>/dev/null || echo 0)
          if [ "$open" = "0" ]; then
            gh issue create \
              --title "Site UNHEALTHY (HTTP ${{ steps.confirm.outputs.code }}, db ${{ steps.confirm.outputs.db }})" \
              --label "site-down" \
              --body "Confirmed after 2 rounds at $(date -u): HTTP ${{ steps.confirm.outputs.code }}, db ${{ steps.confirm.outputs.db }}. First round saw HTTP ${{ steps.check.outputs.code }}. db=down with HTTP 200 means the DB is unreachable (Neon free-plan compute quota) - open console.neon.tech or retry /api/health?db=1. HTTP != 200 means Render is down or redeploying - check Render Deployments Logs. HTTP 429/502/503 usually clears on its own, so it only alerts after 2 failed rounds."
          fi

      - name: Close alert issue if recovered
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          nums=$(gh issue list --state open --label "site-down" --json number -q '.[].number' 2>/dev/null || true)
          for n in $nums; do
            gh issue close "$n" --comment "Site is back UP (HTTP 200, db up) at $(date -u)." 2>/dev/null || true
          done
