name: Keep Render awake + uptime alert

# Render's free tier spins the service down after ~15 min of inactivity, causing
# slow cold-starts / transient 502s. This free GitHub Action pings the health
# endpoint every 5 minutes to keep the instance warm, AND doubles as an uptime
# monitor: it alerts when the site is unhealthy (HTTP != 200 **or** the body
# reports "db":"down") and closes the issue automatically on recovery.
#
# The backend caches the DB probe (~1 hour when "up", 15 s when "down"), so these
# pings do NOT wake Neon every 5 minutes anymore. Waking Neon 24/7 used up the
# free plan's 100 CU-hour monthly compute quota around 27-09-2026 and Neon then
# suspended the database (site logins started failing).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint (wakes Render; DB probe is cached upstream)
        id: check
        run: |
          code=""; db=""; ok="false"
          for i in 1 2 3; do
            out=$(curl -s -w '\n%{http_code}' --max-time 30 https://rafiqi-platform.onrender.com/api/health || true)
            code=$(printf '%s' "$out" | tail -n1)
            body=$(printf '%s' "$out" | sed '$d')
            [ -z "$code" ] && code="000"
            db=$(printf '%s' "$body" | sed -n 's/.*"db":"\([a-z]*\)".*/\1/p')
            echo "attempt $i -> HTTP $code db=${db:-unknown}"
            if [ "$code" = "200" ] && { [ "$db" = "up" ] || [ -z "$db" ]; }; then
              ok="true"; break
            fi
            sleep 20
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "db=${db:-unknown}" >> "$GITHUB_OUTPUT"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Open alert issue if unhealthy
        if: steps.check.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "site-down" --color "d73a4a" --description "Site health check failed" 2>/dev/null || true
          open=$(gh issue list --state open --label "site-down" --json number -q 'length' 2>/dev/null || echo 0)
          if [ "$open" = "0" ]; then
            gh issue create \
              --title "Site UNHEALTHY (HTTP ${{ steps.check.outputs.code }}, db ${{ steps.check.outputs.db }})" \
              --label "site-down" \
              --body "Health check at $(date -u): HTTP ${{ steps.check.outputs.code }}, db ${{ steps.check.outputs.db }}. db=down with HTTP 200 means the DB is unreachable (Neon free-plan compute quota) - open console.neon.tech or retry /api/health?db=1. HTTP != 200 means Render is down or redeploying - check Render Deployments Logs."
          fi

      - name: Close alert issue if recovered
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nums=$(gh issue list --state open --label "site-down" --json number -q '.[].number' 2>/dev/null || true)
          for n in $nums; do
            gh issue close "$n" --comment "Site is back UP (HTTP 200, db up) at $(date -u)." 2>/dev/null || true
          done
