name: Keep Render awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint (wakes Render + Neon)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://rafiqi-platform.onrender.com/api/health || echo 000)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && break
            sleep 20
          done
