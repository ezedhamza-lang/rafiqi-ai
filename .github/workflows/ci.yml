name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # حارس ملفات الترجمة — يمنع سقوط المنصة بيضاء بسبب مفتاح مكرّر.
  # وُلد بعد حادثة 07/10/2026 (مفتاح freeBooks مكرّر داخل footer ⇒ React #31).
  # خفيف جدًا: لا تثبيت حزم، ثانية واحدة.
  i18n-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check i18n keys (types + duplicates + no ZIP link)
        run: node tools/rafiqi-publishing/check_i18n.js

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: school_user
          POSTGRES_PASSWORD: school_pass
          POSTGRES_DB: school_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school_user -d school_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://school_user:school_pass@localhost:5432/school_platform_test?schema=public
      DATABASE_URL: postgresql://school_user:school_pass@localhost:5432/school_platform_test?schema=public
      JWT_SECRET: test-jwt-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run tests
        run: npm test
      - name: Lint
        run: npm run lint

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # ── حرّاس واجهة مكتوبون مسبقًا لكن لم يكن CI يشغّلهم إطلاقًا ──────────
      # (اكتُشف 07/10/2026: اثنان منهم كانا شغّالين يدويًّا فقط، والثالث
      #  كان في اختبارات الخادم فيفشل لأن frontend/node_modules غير موجودة هناك.)
      - name: Check raw codes (AST guard)
        run: npm run check:raw-codes
      - name: Check i18n keys
        run: npm run check:i18n
      - name: Check mojibake
        run: npm run check:mojibake
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
