server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # تمرير كل مسارات الخلفية إلى حاوية الـAPI
  location ~ ^/(api|uploads|assets|images|media|plans|svg|islamic|tech|science|intaj)(/|$) {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25m;
  }

  # WebSocket
  location /ws {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # الأصول المبنية (مختومة) — تخزين طويل
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|webmanifest)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
